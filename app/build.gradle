plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 加载本地发布签名属性
def localProperties = new Properties()
// 定位忽略提交的本地属性文件
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.isFile()) {
    // 读取本地属性文件内容
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

// 定义发布签名所需的统一属性
def releaseSigningKeys = [
        'RELEASE_STORE_FILE',
        'RELEASE_STORE_PASSWORD',
        'RELEASE_KEY_ALIAS',
        'RELEASE_KEY_PASSWORD'
]
// 按环境变量优先级解析发布签名属性
def releaseSigningValues = releaseSigningKeys.collectEntries { key ->
    // 读取当前签名属性对应的环境变量
    def environmentValue = System.getenv(key)
    [(key): environmentValue != null ? environmentValue : localProperties.getProperty(key)]
}
// 收集缺失的发布签名属性
def missingReleaseSigningKeys = releaseSigningKeys.findAll { key ->
    !releaseSigningValues[key]?.trim()
}
// 标记发布签名属性是否完整
def hasReleaseSigning = missingReleaseSigningKeys.isEmpty()

// 阻止发布任务生成未签名的分发产物
gradle.taskGraph.whenReady { taskGraph ->
    // 判断任务图是否包含发布任务
    def includesReleaseTask = taskGraph.allTasks.any { task ->
        task.name.toLowerCase(Locale.ROOT).contains('release')
    }
    if (includesReleaseTask && !hasReleaseSigning) {
        throw new GradleException(
                "Missing required release signing properties: "
                        + missingReleaseSigningKeys.join(', ')
        )
    }
}

android {
    namespace = 'com.jaxson.coloros.synologynas'
    compileSdk = 37
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'com.jaxson.coloros.synologynas'
        minSdk = 36
        targetSdk = 37
        versionCode = 10
        versionName = '1.3.4'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile = rootProject.file(releaseSigningValues['RELEASE_STORE_FILE'])
                storePassword = releaseSigningValues['RELEASE_STORE_PASSWORD']
                keyAlias = releaseSigningValues['RELEASE_KEY_ALIAS']
                keyPassword = releaseSigningValues['RELEASE_KEY_PASSWORD']
                storeType = 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    packaging {
        resources {
            merges.add('META-INF/xposed/*')
            excludes.add('META-INF/DEPENDENCIES')
            excludes.add('META-INF/LICENSE*')
            excludes.add('META-INF/NOTICE*')
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = false
    }
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.3'
    implementation 'io.github.libxposed:service:102.0.0'
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    testImplementation 'io.github.libxposed:api:102.0.0'
}
